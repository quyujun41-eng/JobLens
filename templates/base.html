<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Boss直聘 AI应用开发岗位市场雷达{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="nav">
        <span class="brand">Boss直聘 AI应用开发岗位市场雷达 · 深圳</span>
        <nav>
            <a href="{{ url_for('seeker_view') }}" class="{{ 'active' if request.endpoint == 'seeker_view' else '' }}">求职者视图</a>
            <a href="{{ url_for('hr_view') }}" class="{{ 'active' if request.endpoint == 'hr_view' else '' }}">HR/企业视图</a>
            <a href="{{ url_for('jobs_view') }}" class="{{ 'active' if request.endpoint == 'jobs_view' else '' }}">招聘信息汇总</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
