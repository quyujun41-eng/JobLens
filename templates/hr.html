{% extends "base.html" %}
{% block title %}HR/企业视图 - Boss直聘 AI岗位市场雷达{% endblock %}
{% block content %}
<div class="card">
    <h3>选择对标公司</h3>
    <select id="company-select">
        <option value="">请选择公司</option>
        {% for name in companies %}
        <option value="{{ name }}">{{ name }}</option>
        {% endfor %}
    </select>
    <p id="benchmark-summary"></p>
</div>

<div class="grid">
    <div class="card">
        <h3>薪资对标：选定公司 vs 深圳市场平均</h3>
        <div id="chart-benchmark" class="chart"></div>
    </div>
    <div class="card">
        <h3>各方向岗位需求热度走势</h3>
        <div id="chart-demand-trend" class="chart"></div>
    </div>
</div>

<script>
const benchmarkChart = echarts.init(document.getElementById('chart-benchmark'));
const summaryEl = document.getElementById('benchmark-summary');

document.getElementById('company-select').addEventListener('change', e => {
    const name = e.target.value;
    if (!name) {
        summaryEl.textContent = '';
        benchmarkChart.clear();
        return;
    }
    fetch('/api/company_benchmark?company=' + encodeURIComponent(name))
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                summaryEl.textContent = data.error;
                benchmarkChart.clear();
                return;
            }
            summaryEl.textContent =
                data.company_name + ' 当前在招岗位 ' + data.company_job_count + ' 个，' +
                '平均薪资 ' + data.company_avg_salary + 'K，区间 ' +
                data.company_min + '-' + data.company_max + 'K；' +
                '深圳市场平均薪资 ' + data.market_avg_salary + 'K（样本 ' + data.market_job_count + ' 个岗位）。';
            benchmarkChart.setOption({
                tooltip: {},
                xAxis: { type: 'category', data: [data.company_name, '深圳市场平均水平'] },
                yAxis: { type: 'value', name: '平均薪资(K)' },
                series: [{
                    type: 'bar',
                    data: [
                        { value: data.company_avg_salary, itemStyle: { color: '#5470c6' } },
                        { value: data.market_avg_salary, itemStyle: { color: '#bbb' } }
                    ]
                }]
            });
        });
});

const trendChart = echarts.init(document.getElementById('chart-demand-trend'));
fetch('/api/keyword_demand_trend').then(r => r.json()).then(data => {
    const series = Object.keys(data.series).map(kw => ({
        name: kw, type: 'line', smooth: true, data: data.series[kw]
    }));
    trendChart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: Object.keys(data.series), top: 26, textStyle: { fontSize: 11 } },
        grid: { top: 76 },
        xAxis: { type: 'category', data: data.months },
        yAxis: { type: 'value', name: '新增岗位数' },
        series: series
    });
});

window.addEventListener('resize', () => { benchmarkChart.resize(); trendChart.resize(); });
</script>
{% endblock %}
